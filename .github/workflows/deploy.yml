steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Generate lockfile & Install
      run: |
        npm i --package-lock-only
        npm install

    - name: Build project
      run: npm run build --if-present
